name: Pull request checks

# Runs the format check, the type check, and the test suite on every pull
# request targeting main and on pushes to it. The repo ruleset "Requirements
# for merge" requires this job's check, so a PR cannot merge unless it passes.
#
# The job id `checks` is the required-check name in the ruleset. Never rename it.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new push to the same branch or PR cancels the previous in-progress run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository to the runner machine
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs the committed package-lock.json and ignores the lefthook
      # `prepare` script, which is what we want on a runner with no git hooks.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # One umbrella script, the same one a developer runs locally, so CI and
      # the local check cannot drift apart. Order: format, types, tests.
      - name: Run the checks
        run: npm run check
